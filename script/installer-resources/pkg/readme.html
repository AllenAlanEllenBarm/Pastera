<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <style>
    body { font: -apple-system-body; margin: 0; color: #1d1d1f; }
    h1 { font: -apple-system-title2; margin: 0 0 12px; }
    ol { padding-left: 22px; }
    li { font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
  </style>
</head>
<body>
  <h1>安装后还需要完成一次授权</h1>
  <ol>
    <li>Pastera 会安装到 Applications。</li>
    <li>安装完成后，Pastera 会自动打开“完成 Pastera 设置”窗口。</li>
    <li>点击“打开辅助功能设置”，在“隐私与安全性 > 辅助功能”中允许 Pastera。</li>
  </ol>
  <p>If macOS says it cannot verify Pastera, the package still needs Developer ID signing and notarization for public release.</p>
</body>
</html>
